<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/style.css">
    <title>Internet Start Page</title>
</head>
<body>
<header>
    <h1>My Internet Start Page</h1>
</header>

<main class="grid-container">
    <p>Zoekopdracht</p>
    <div class="zoek-opdracht">
        <input type="text" id="cmdInput" placeholder="Enter commando">
        <label for="cmdInput">Start your commando with "/[character] [zoekopdracht]"</label>
    </div>
    <input type="button" value="GO!" id="goBtn">
    <div>
        <h2>History</h2>
        <div class="grid-container-history">
        </div>
    </div>
</main>


<script src="scripts/code.js"></script>
</body>
</html>
